<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>APM 监控</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="topbar" class="anim-enter">
    <div class="brand"><span class="brand-dot"></span>APM 监控</div>
    <span id="status"></span>
    <div class="spacer"></div>
    <button id="btn-query" class="btn-primary btn-big">
      <span class="btn-label">开始统计</span>
    </button>
    <button id="btn-stop" class="btn-ghost hidden">停止</button>
  </header>

  <details id="settings" class="card anim-enter">
    <summary><span class="card-title">设置</span><span class="muted" id="settings-hint"></span></summary>
    <div class="grid">
      <label class="field">地域
        <select id="region"></select>
      </label>
      <label class="field" id="field-team">业务系统 ID (team)
        <input id="instance-id" placeholder="apm-tHxaVZjHH" />
      </label>
      <label class="field">regionId (Cookie 模式用)
        <input id="region-id" type="number" style="width:100px" />
      </label>
      <div class="auth-block">
        <div class="row">
          <button id="btn-cloud-login" class="btn-primary">扫码登录</button>
          <span id="session-state" class="muted">会话状态读取中…</span>
        </div>
      </div>
      <details id="more">
        <summary><span class="card-title">更多</span><span class="muted">会话维护</span></summary>
        <div class="grid">
          <label class="field">提前刷新阈值（分钟）
            <input id="sess-refresh-min" type="number" min="1" style="width:100px" />
          </label>
          <label class="field">刷新失败退避（分钟）
            <input id="sess-backoff-min" type="number" min="1" style="width:100px" />
          </label>
          <label class="field">连续失败上限（次）
            <input id="sess-max-fails" type="number" min="1" style="width:100px" />
          </label>
          <label class="field">后台自动刷新
            <input id="sess-auto-refresh" type="checkbox" />
          </label>
          <label class="field">微信快捷登录（免扫码）
            <input id="sess-auto-quick-login" type="checkbox" />
          </label>
        </div>
      </details>
    </div>
  </details>

  <div id="config-row">
    <section id="scenario-section" class="card anim-enter">
      <div class="card-title">场景 <span class="muted">（激活命名场景后，勾选改动实时回写）</span></div>
      <div class="row" style="margin:0">
        <div id="scenario-chips" class="chips" style="flex:1"></div>
        <button class="btn-mini" id="btn-scenario-save">存为场景</button>
        <button class="btn-mini" id="btn-scenario-delete">删除当前场景</button>
      </div>
    </section>

    <section id="time-section" class="card anim-enter">
      <div class="card-title">监控对象 <span class="muted">（可同时勾选多个数据源）</span></div>
      <div id="source-chips" class="chips"></div>
    </section>

    <section id="time-section2" class="card anim-enter">
      <div class="card-title">统计时间</div>
      <div id="quick-ranges" class="chips"></div>
      <div id="custom-range" class="row hidden">
        <label class="field">开始 <input type="datetime-local" id="custom-start" step="60" /></label>
        <label class="field">结束 <input type="datetime-local" id="custom-end" step="60" /></label>
      </div>
      <div id="range-hint" class="muted"></div>
    </section>
  </div>

  <div id="main-cols">
    <section id="apps-section" class="card anim-enter">
      <div class="tabs" id="list-tabs"></div>
      <div class="row">
        <button id="btn-load-apps" class="btn-ghost">加载列表</button>
        <input id="app-search" placeholder="搜索过滤…" style="flex:1" />
      </div>
      <div id="container-pickers" class="row hidden"></div>
      <div class="row">
        <button class="btn-mini active" id="btn-app-filter-all">全部</button>
        <button class="btn-mini" id="btn-app-all">全选</button>
        <button class="btn-mini" id="btn-app-none">清空</button>
        <button class="btn-mini" id="btn-app-selected">已选</button>
        <span class="muted">当前页签已选 <b id="selected-app-count">0</b> 个</span>
      </div>
      <div id="app-list" class="check-list"></div>
    </section>

    <section id="metrics-section" class="card anim-enter">
      <div class="tabs" id="metric-tabs"></div>
      <div class="row">
        <button id="btn-refresh-metrics" class="btn-ghost">刷新指标清单</button>
        <button class="btn-mini" id="btn-metrics-default">恢复默认勾选</button>
      </div>
      <div id="metric-list" class="check-list"></div>
    </section>
  </div>

  <div id="action-bar" class="anim-enter">
    <button id="btn-query-2" class="btn-primary btn-big" style="padding: 11px 64px; font-size: 16px">
      <span class="btn-label">开始统计</span>
    </button>
  </div>

  <section id="results-section" class="card anim-enter">
    <div class="row" style="justify-content: space-between">
      <div class="card-title">统计结果</div>
      <button class="btn-mini" id="btn-copy-all">复制全部</button>
    </div>
    <div id="results">
      <div id="empty-hint" class="muted" style="padding:24px; text-align:center">
        选好应用和指标后，点右上角「开始统计」
      </div>
    </div>
  </section>

  <details id="log-panel" class="card anim-enter" open>
    <summary>
      <span class="card-title">实时日志</span>
      <button class="btn-mini" id="btn-log-clear">清空</button>
    </summary>
    <pre id="log-box"></pre>
  </details>

  <script src="_preview_mock.js"></script>
  <script src="vendor/anime.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
